<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0d18"/>
      <stop offset="100%" stop-color="#06070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="120" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161a36" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#06070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="540" y1="80" x2="700" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c8bff"/>
      <stop offset="100%" stop-color="#b06cff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c8bff"/>
      <stop offset="100%" stop-color="#b06cff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle starfield -->
  <g fill="#ffffff" fill-opacity="0.35">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="220" cy="180" r="1"/>
    <circle cx="430" cy="60" r="1"/>
    <circle cx="980" cy="120" r="1.5"/>
    <circle cx="1110" cy="220" r="1"/>
    <circle cx="80" cy="380" r="1"/>
    <circle cx="1050" cy="480" r="1.5"/>
    <circle cx="320" cy="520" r="1"/>
    <circle cx="780" cy="550" r="1"/>
    <circle cx="640" cy="100" r="1"/>
  </g>

  <!-- brand mark — gradient triangle -->
  <g transform="translate(70 70)">
    <rect width="120" height="120" rx="26" fill="#06070d" stroke="#232842" stroke-width="2"/>
    <path d="M60 26 L98 94 L22 94 Z" fill="url(#mark)"/>
  </g>

  <text x="220" y="155" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e8ecf8" letter-spacing="-0.5">
    Sealed Launch
  </text>

  <!-- big tagline -->
  <text x="70" y="320" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#e8ecf8" letter-spacing="-1.5">
    Order doesn't matter.
  </text>
  <text x="70" y="402" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="url(#accent)" letter-spacing="-1.5">
    One uniform price.
  </text>

  <text x="70" y="470" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#9aa3c4">
    A sealed batch-auction launch hook for Uniswap v4 on X Layer.
  </text>

  <!-- bottom chips -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
    <g transform="translate(70 545)">
      <rect width="170" height="42" rx="21" fill="#111426" stroke="#232842"/>
      <text x="22" y="28" fill="#9aa3c4">Uniswap v4</text>
    </g>
    <g transform="translate(255 545)">
      <rect width="140" height="42" rx="21" fill="#111426" stroke="#232842"/>
      <text x="22" y="28" fill="#9aa3c4">X Layer</text>
    </g>
    <g transform="translate(410 545)">
      <rect width="220" height="42" rx="21" fill="#111426" stroke="#232842"/>
      <text x="22" y="28" fill="#9aa3c4">commit · reveal · settle</text>
    </g>
    <g transform="translate(645 545)">
      <rect width="190" height="42" rx="21" fill="#111426" stroke="#232842"/>
      <text x="22" y="28" fill="#9aa3c4">62/62 tests</text>
    </g>
  </g>

  <!-- URL bottom right -->
  <text x="1130" y="595" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#6c8bff">
    sealedlaunch.gudman.xyz
  </text>
</svg>
