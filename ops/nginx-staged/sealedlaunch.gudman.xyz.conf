server {
    listen 80;
    listen [::]:80;
    server_name sealedlaunch.gudman.xyz;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sealedlaunch.gudman.xyz;

    ssl_certificate /etc/letsencrypt/live/sealedlaunch.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sealedlaunch.gudman.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    root /opt/liftoff/public;
    index index.html;

    # `^~` so this prefix match beats the static-asset regex below — otherwise
    # /app/icon.svg, /app/manifest.webmanifest, etc. would be misrouted to the
    # static root and 404.
    location ^~ /app {
        proxy_pass http://127.0.0.1:3072;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
