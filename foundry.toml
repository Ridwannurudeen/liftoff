[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]
libs = ["lib"]
out = "out"
# No pinned solc: v4-core's PoolManager pins =0.8.26 (needed to self-deploy on X Layer testnet),
# while our hook is ^0.8.26 — let forge resolve per-file.
src = "src"
via_ir = false

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false
