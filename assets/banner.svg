<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0d18"/>
      <stop offset="100%" stop-color="#06070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="750" cy="80" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161a36" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="280" y1="120" x2="380" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c8bff"/>
      <stop offset="100%" stop-color="#b06cff"/>
    </linearGradient>
    <linearGradient id="accent" x1="420" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c8bff"/>
      <stop offset="100%" stop-color="#b06cff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c8bff"/>
      <stop offset="100%" stop-color="#b06cff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- subtle starfield — none inside profile-circle clear zone (x:50-250, y:340-500) -->
  <g fill="#ffffff">
    <circle cx="90"   cy="60"  r="1.5" fill-opacity="0.40"/>
    <circle cx="180"  cy="120" r="1"   fill-opacity="0.32"/>
    <circle cx="360"  cy="50"  r="1"   fill-opacity="0.35"/>
    <circle cx="540"  cy="90"  r="1.5" fill-opacity="0.42"/>
    <circle cx="720"  cy="40"  r="1"   fill-opacity="0.30"/>
    <circle cx="900"  cy="110" r="1"   fill-opacity="0.38"/>
    <circle cx="1080" cy="60"  r="1.5" fill-opacity="0.45"/>
    <circle cx="1240" cy="140" r="1"   fill-opacity="0.32"/>
    <circle cx="1380" cy="70"  r="1"   fill-opacity="0.36"/>
    <circle cx="1420" cy="240" r="1.5" fill-opacity="0.40"/>
    <circle cx="1180" cy="320" r="1"   fill-opacity="0.34"/>
    <circle cx="980"  cy="430" r="1"   fill-opacity="0.32"/>
    <circle cx="1320" cy="450" r="1.5" fill-opacity="0.38"/>
    <circle cx="640"  cy="450" r="1"   fill-opacity="0.30"/>
  </g>

  <!-- brand mark — 100x100 dark rounded square + gradient triangle -->
  <g>
    <rect x="280" y="120" width="100" height="100" rx="22" fill="#06070d" stroke="#232842" stroke-width="2"/>
    <path d="M330 140 L370 210 L290 210 Z" fill="url(#mark)"/>
  </g>

  <!-- big headline -->
  <text x="420" y="165" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#e8ecf8" letter-spacing="-1">
    Order doesn't matter.
  </text>
  <text x="420" y="250" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#accent)" letter-spacing="-1">
    One uniform price.
  </text>

  <!-- subline -->
  <text x="420" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#9aa3c4">
    Sealed batch-auction launch hook for Uniswap v4 on X Layer.
  </text>

  <!-- chips row -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    <g transform="translate(420 365)">
      <rect width="150" height="40" rx="20" fill="#111426" stroke="#232842"/>
      <text x="22" y="26" fill="#9aa3c4">Uniswap v4</text>
    </g>
    <g transform="translate(586 365)">
      <rect width="120" height="40" rx="20" fill="#111426" stroke="#232842"/>
      <text x="22" y="26" fill="#9aa3c4">X Layer</text>
    </g>
    <g transform="translate(722 365)">
      <rect width="260" height="40" rx="20" fill="#111426" stroke="#232842"/>
      <text x="22" y="26" fill="#9aa3c4">commit · reveal · settle</text>
    </g>
    <g transform="translate(998 365)">
      <rect width="160" height="40" rx="20" fill="#111426" stroke="#232842"/>
      <text x="22" y="26" fill="#9aa3c4">62/62 tests</text>
    </g>
  </g>

  <!-- right edge accent bar -->
  <rect x="1450" y="0" width="4" height="500" fill="url(#edge)"/>

  <!-- URL bottom right -->
  <text x="1430" y="470" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="500" fill="#6c8bff">
    sealedlaunch.gudman.xyz
  </text>
</svg>
