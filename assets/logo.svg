<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c8bff"/>
      <stop offset="100%" stop-color="#b06cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="420" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161a36" stop-opacity="1"/>
      <stop offset="60%" stop-color="#06070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background rounded square -->
  <rect width="1024" height="1024" rx="96" fill="#06070d"/>

  <!-- inner radial glow behind triangle -->
  <rect width="1024" height="1024" rx="96" fill="url(#glow)"/>

  <!-- subtle starfield in negative space -->
  <g fill="#ffffff">
    <circle cx="140" cy="170" r="2.5" fill-opacity="0.40"/>
    <circle cx="240" cy="300" r="2" fill-opacity="0.30"/>
    <circle cx="880" cy="200" r="3" fill-opacity="0.45"/>
    <circle cx="820" cy="340" r="2" fill-opacity="0.32"/>
    <circle cx="110" cy="780" r="2" fill-opacity="0.35"/>
    <circle cx="910" cy="860" r="2.5" fill-opacity="0.42"/>
    <circle cx="190" cy="900" r="2" fill-opacity="0.30"/>
  </g>

  <!-- brand mark: gradient up-pointing triangle, base 720, apex y=230, base y=800 -->
  <path d="M512 230 L872 800 L152 800 Z"
        fill="url(#mark)"
        stroke="url(#edge)"
        stroke-width="1.5"
        stroke-linejoin="round"/>
</svg>
